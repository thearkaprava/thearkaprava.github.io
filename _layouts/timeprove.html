---
# Minimal layout for TimeProVe project page.
# We intentionally skip the site's masthead and left sidebar ribbons.
layout: compress
---
{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 | default: " en" }}" class="no-js">
<head>
  {% include head.html %}
  {% include head/custom.html %}
  <style>
    .timeprove-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1rem 2.5rem 1rem;
    }
    .timeprove-hero {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .timeprove-title {
      margin: 0 0 0.25rem 0;
      font-size: 2.4rem;
      letter-spacing: 0.03em;
    }
    .timeprove-subtitle {
      margin: 0 0 1.25rem 0;
      font-size: 1rem;
      color: #555;
    }
    .timeprove-capsules {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1.75rem;
    }
    .timeprove-capsules .btn {
      border-radius: 9999px;
      padding: 0.4rem 1.3rem;
      font-size: 0.9rem;
      margin: 0;
    }
    .timeprove-page h2 {
      margin-top: 1.75rem;
      margin-bottom: 0.5rem;
    }
    .timeprove-page p {
      margin-top: 0.35rem;
      margin-bottom: 0.75rem;
    }
    .timeprove-page img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0.6rem 0 0.75rem 0;
      border-radius: 10px;
      border: 1px solid rgba(0, 0, 0, 0.08);
    }
  </style>
</head>
<body>
  {% include browser-upgrade.html %}

  <main class="timeprove-page">
    {{ content }}
  </main>

  {% include scripts.html %}
</body>
</html>
