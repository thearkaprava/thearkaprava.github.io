---
# Minimal layout for TimeProVe project page.
# We intentionally skip the site's masthead and left sidebar ribbons.
layout: compress
---
{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 | default: " en" }}" class="no-js">
<head>
  {% include head.html %}
  {% include head/custom.html %}
  <style>
    .timeprove-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1rem 2.5rem 1rem;
      text-align: center;
    }
    .timeprove-hero {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .timeprove-title {
      margin: 0 0 0.25rem 0;
      font-size: 2.05rem;
      letter-spacing: 0.03em;
    }
    .tp-sc {
      font-variant: small-caps;
      letter-spacing: 0.05em;
    }
    .timeprove-subtitle {
      margin: 0 0 1.25rem 0;
      font-size: 1rem;
      color: #555;
    }
    /* Bulma-ish helpers used by the capsule snippet */
    .has-text-centered { text-align: center; }
    .publication-authors {
      font-size: 1.1rem;
      line-height: 2;
    }
    .publication-authors .author-block a {
      color: #333;
      text-decoration: none;
      border-bottom: 1px dashed #aaa;
    }
    .publication-authors .author-block a:hover {
      color: #000;
      border-bottom-color: #333;
    }
    .publication-links { margin-bottom: 1.75rem; }
    .publication-links .link-block { display: inline-block; margin: 0 0.45rem 0.6rem 0.45rem; }
    .publication-links .button {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1.15rem;
      font-size: 0.95rem;
      font-weight: 600;
      border: 1px solid rgba(0,0,0,0.12);
      background: #111;
      color: #fff !important;
      text-decoration: none !important;
      transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
    }
    .publication-links .button.is-rounded { border-radius: 9999px; }
    .publication-links .button.is-dark { background: #111; }
    .publication-links .button:hover {
      transform: translateY(-1px);
      background: #000;
      border-color: rgba(0,0,0,0.18);
    }
    .publication-links .icon { display: inline-flex; align-items: center; }
    .publication-links .icon i { font-size: 1.1em; }
    .timeprove-page h2 {
      margin-top: 1.75rem;
      margin-bottom: 0.5rem;
    }
    .timeprove-page p {
      margin-top: 0.35rem;
      margin-bottom: 0.75rem;
      text-align: center;
    }
    .timeprove-page li {
      text-align: center;
      list-style-position: inside;
    }
    .timeprove-page img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0.6rem 0 0.75rem 0;
      border: none;
      border-radius: 0;
    }
    .abstract-grid {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 1.25rem;
      align-items: start;
      margin-top: 0.25rem;
      margin-bottom: 0.75rem;
    }
    .abstract-grid h2 {
      margin-top: 0;
    }
    .teaser-panel img {
      margin-top: 0;
      margin-bottom: 0.45rem;
      border: none;
      border-radius: 0;
    }
    .teaser-caption {
      font-size: 0.92rem;
      line-height: 1.45;
      margin: 0;
      color: #555;
      text-align: center;
    }
    .figure-caption {
      margin-top: -0.15rem;
      margin-bottom: 0.9rem;
      font-size: 0.92rem;
      color: #555;
      text-align: center;
    }
    .timeprove-page pre,
    .timeprove-page .highlight,
    .timeprove-page .highlight pre,
    .timeprove-page .highlight code {
      text-align: left;
    }
    .timeprove-page pre {
      display: block;
      margin-left: 0;
      margin-right: auto;
    }
    .bibtex-block {
      position: relative;
      text-align: left;
      margin: 0 auto 1.5rem;
      max-width: 100%;
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 8px;
      background: #f8f8f8;
      padding: 1rem 1rem 0.75rem;
    }
    .bibtex-copy-btn {
      position: absolute;
      top: 0.55rem;
      right: 0.55rem;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.35rem 0.7rem;
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 6px;
      background: #fff;
      color: #222;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease;
    }
    .bibtex-copy-btn:hover {
      background: #f0f0f0;
      border-color: rgba(0, 0, 0, 0.22);
    }
    .bibtex-copy-btn.is-copied {
      color: #1b7f3b;
      border-color: rgba(27, 127, 59, 0.35);
    }
    .bibtex-code {
      margin: 0;
      padding-top: 1.75rem;
      overflow-x: auto;
      font-size: 0.85rem;
      line-height: 1.5;
      white-space: pre;
      background: transparent;
      border: none;
      box-shadow: none;
    }
    .bibtex-code code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    @media (max-width: 900px) {
      .abstract-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  {% include browser-upgrade.html %}

  <main class="timeprove-page">
    {{ content }}
  </main>

  {% include scripts.html %}
  <script>
    document.querySelectorAll(".bibtex-copy-btn").forEach(function (button) {
      button.addEventListener("click", function () {
        var targetId = button.getAttribute("data-copy-target");
        var target = targetId ? document.getElementById(targetId) : null;
        if (!target) return;

        var text = target.textContent.trim();
        var copiedLabel = '<i class="fa-solid fa-check"></i> Copied!';
        var defaultLabel = button.innerHTML;

        function markCopied() {
          button.classList.add("is-copied");
          button.innerHTML = copiedLabel;
          window.setTimeout(function () {
            button.classList.remove("is-copied");
            button.innerHTML = defaultLabel;
          }, 1800);
        }

        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(markCopied).catch(function () {
            fallbackCopy(text, markCopied);
          });
        } else {
          fallbackCopy(text, markCopied);
        }
      });
    });

    function fallbackCopy(text, onSuccess) {
      var textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand("copy");
        onSuccess();
      } catch (error) {
        window.prompt("Copy BibTeX:", text);
      }
      document.body.removeChild(textarea);
    }
  </script>
</body>
</html>
