---
# Minimal layout for TimeProVe project page.
# We intentionally skip the site's masthead and left sidebar ribbons.
layout: compress
---
{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 | default: " en" }}" class="no-js">
<head>
  {% include head.html %}
  {% include head/custom.html %}
  <style>
    .timeprove-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1rem 2.5rem 1rem;
      text-align: center;
    }
    .timeprove-hero {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .timeprove-title {
      margin: 0 0 0.25rem 0;
      font-size: 2.05rem;
      letter-spacing: 0.03em;
    }
    .tp-sc {
      font-variant: small-caps;
      letter-spacing: 0.05em;
    }
    .timeprove-subtitle {
      margin: 0 0 1.25rem 0;
      font-size: 1rem;
      color: #555;
    }
    /* Bulma-ish helpers used by the capsule snippet */
    .has-text-centered { text-align: center; }
    .publication-authors {
      font-size: 1.1rem;
      line-height: 2;
    }
    .publication-authors .author-block a {
      color: #333;
      text-decoration: none;
      border-bottom: 1px dashed #aaa;
    }
    .publication-authors .author-block a:hover {
      color: #000;
      border-bottom-color: #333;
    }
    .publication-links { margin-bottom: 1.75rem; }
    .publication-links .link-block { display: inline-block; margin: 0 0.45rem 0.6rem 0.45rem; }
    .publication-links .button {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1.15rem;
      font-size: 0.95rem;
      font-weight: 600;
      border: 1px solid rgba(0,0,0,0.12);
      background: #111;
      color: #fff !important;
      text-decoration: none !important;
      transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
    }
    .publication-links .button.is-rounded { border-radius: 9999px; }
    .publication-links .button.is-dark { background: #111; }
    .publication-links .button:hover {
      transform: translateY(-1px);
      background: #000;
      border-color: rgba(0,0,0,0.18);
    }
    .publication-links .icon { display: inline-flex; align-items: center; }
    .publication-links .icon i { font-size: 1.1em; }
    .timeprove-page h2 {
      margin-top: 1.75rem;
      margin-bottom: 0.5rem;
    }
    .timeprove-page p {
      margin-top: 0.35rem;
      margin-bottom: 0.75rem;
      text-align: center;
    }
    .timeprove-page li {
      text-align: center;
      list-style-position: inside;
    }
    .timeprove-page img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0.6rem 0 0.75rem 0;
      border: none;
      border-radius: 0;
    }
    .abstract-grid {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 1.25rem;
      align-items: start;
      margin-top: 0.25rem;
      margin-bottom: 0.75rem;
    }
    .abstract-grid h2 {
      margin-top: 0;
    }
    .teaser-panel img {
      margin-top: 0;
      margin-bottom: 0.45rem;
      border: none;
      border-radius: 0;
    }
    .teaser-caption {
      font-size: 0.92rem;
      line-height: 1.45;
      margin: 0;
      color: #555;
      text-align: center;
    }
    .figure-caption {
      margin-top: -0.15rem;
      margin-bottom: 0.9rem;
      font-size: 0.92rem;
      color: #555;
      text-align: center;
    }
    @media (max-width: 900px) {
      .abstract-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  {% include browser-upgrade.html %}

  <main class="timeprove-page">
    {{ content }}
  </main>

  {% include scripts.html %}
</body>
</html>
