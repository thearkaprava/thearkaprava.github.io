<!-- Theme toggle button -->
<div id="theme-toggle" style="position: fixed; top: 1em; right: 1em; z-index: 1000;">
    <button onclick="toggleTheme()" style="background: none; border: none; padding: 8px; cursor: pointer;">
        <i class="fas fa-sun" id="theme-toggle-icon" style="font-size: 20px;"></i>
    </button>
</div>

<!-- Theme styles -->
<style>
    :root {
        --bg-color: #ffffff;
        --text-color: #000000;
        --link-color: #0366d6;
        --masthead-bg: #f5f5f5;
        --social-icon-color: #000000;
    }

    :root[data-theme="dark"] {
        --bg-color: #1a1a1a;
        --text-color: #ffffff;
        --link-color: #ffd700;
        --masthead-bg: #2d2d2d;
        --social-icon-color: #ffffff;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-color);
        transition: background-color 0.3s, color 0.3s;
    }

    #theme-toggle-icon {
        color: var(--text-color);
        transition: color 0.3s;
    }

    a {
        color: var(--link-color) !important;
        transition: color 0.3s;
    }

    .masthead {
        background-color: var(--masthead-bg) !important;
        transition: background-color 0.3s;
    }

    .author__urls-wrapper i.fa,
    .author__urls-wrapper i.fab,
    .author__urls-wrapper i.fas,
    .author__urls-wrapper i.ai {
        color: var(--social-icon-color) !important;
        transition: color 0.3s;
    }
</style>

<!-- Theme toggle script -->
<script>
    // Debug logging function
    function logDebug(message) {
        console.log(`[Theme Toggle Debug]: ${message}`);
    }

    // Initialize theme based on user preference or stored setting
    function initTheme() {
        try {
            logDebug('Initializing theme...');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const savedTheme = localStorage.getItem('theme');
            const theme = savedTheme || (prefersDark ? 'dark' : 'light');

            logDebug(`Setting initial theme to: ${theme}`);
            document.documentElement.setAttribute('data-theme', theme);
            updateIcon(theme === 'dark');
        } catch (error) {
            console.error('Error initializing theme:', error);
        }
    }

    // Update icon appearance
    function updateIcon(isDark) {
        try {
            const icon = document.getElementById('theme-toggle-icon');
            if (icon) {
                icon.className = isDark ? 'fas fa-moon' : 'fas fa-sun';
                logDebug(`Icon updated to: ${isDark ? 'moon' : 'sun'}`);
            } else {
                logDebug('Theme toggle icon element not found');
            }
        } catch (error) {
            console.error('Error updating icon:', error);
        }
    }

    // Toggle theme function
    function toggleTheme() {
        try {
            logDebug('Toggle theme called');
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

            logDebug(`Switching theme from ${currentTheme} to ${newTheme}`);
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateIcon(newTheme === 'dark');
        } catch (error) {
            console.error('Error toggling theme:', error);
        }
    }

    // Ensure the toggle button exists and is properly set up
    function setupThemeToggle() {
        try {
            const toggleButton = document.getElementById('theme-toggle');
            if (toggleButton) {
                logDebug('Theme toggle button found');
                // Remove any existing click listeners
                const newButton = toggleButton.cloneNode(true);
                toggleButton.parentNode.replaceChild(newButton, toggleButton);

                // Add click listener
                newButton.querySelector('button').addEventListener('click', function (e) {
                    e.preventDefault();
                    toggleTheme();
                });
            } else {
                logDebug('Theme toggle button not found');
            }
        } catch (error) {
            console.error('Error setting up theme toggle:', error);
        }
    }

    // Run initialization when DOM is ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () {
            logDebug('DOM Content Loaded');
            initTheme();
            setupThemeToggle();
        });
    } else {
        logDebug('DOM already loaded');
        initTheme();
        setupThemeToggle();
    }

    // Add listener for system theme changes
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        logDebug('System theme preference changed');
        if (!localStorage.getItem('theme')) {
            updateIcon(e.matches);
            document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
        }
    });
</script>

<!-- end custom head snippets -->
