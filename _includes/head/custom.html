<!-- Support for MatJax -->
<script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<!-- Theme toggle button -->
<div id="theme-toggle" style="position: fixed; top: 1em; right: 1em; z-index: 1000;">
    <button onclick="toggleTheme()" style="background: none; border: none; padding: 8px; cursor: pointer;">
        <i class="fas fa-sun" id="theme-toggle-icon" style="font-size: 20px;"></i>
    </button>
</div>

<!-- Theme styles -->
<style>
    :root {
        --bg-color: #ffffff;
        --text-color: #000000;
        --link-color: #0366d6;
        --masthead-bg: #f5f5f5;
        --social-icon-color: #000000;
    }

    :root[data-theme="dark"] {
        --bg-color: #1a1a1a;
        --text-color: #ffffff;
        --link-color: #ffd700;
        --masthead-bg: #2d2d2d;
        --social-icon-color: #ffffff;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-color);
        transition: background-color 0.3s, color 0.3s;
    }

    #theme-toggle-icon {
        color: var(--text-color);
        transition: color 0.3s;
    }

    a {
        color: var(--link-color) !important;
        transition: color 0.3s;
    }

    .masthead {
        background-color: var(--masthead-bg) !important;
        transition: background-color 0.3s;
    }

    .author__urls-wrapper i.fa,
    .author__urls-wrapper i.fab,
    .author__urls-wrapper i.fas,
    .author__urls-wrapper i.ai {
        color: var(--social-icon-color) !important;
        transition: color 0.3s;
    }
</style>

<!-- Theme toggle script -->
<script>
    // Initialize theme based on user preference or stored setting
    function initTheme() {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const savedTheme = localStorage.getItem('theme');
        const theme = savedTheme || (prefersDark ? 'dark' : 'light');

        document.documentElement.setAttribute('data-theme', theme);
        updateIcon(theme === 'dark');
    }

    // Update icon appearance
    function updateIcon(isDark) {
        const icon = document.getElementById('theme-toggle-icon');
        if (icon) {
            icon.className = isDark ? 'fas fa-moon' : 'fas fa-sun';
        }
    }

    // Toggle theme function
    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateIcon(newTheme === 'dark');
    }

    // Run initialization when DOM is ready
    document.addEventListener('DOMContentLoaded', initTheme);

    // Also run immediately in case the script loads after DOMContentLoaded
    if (document.readyState !== 'loading') {
        initTheme();
    }
</script>

<!-- end custom head snippets -->
