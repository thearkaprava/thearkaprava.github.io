<!-- Add theme toggle button -->
<div class="theme-toggle" id="unique-theme-toggle" style="position: fixed; top: 1em; right: 1em; z-index: 1000;">
    <button id="theme-toggle-button" style="background: none; border: none; padding: 8px; cursor: pointer;">
        <i class="fas fa-sun" id="theme-toggle-icon" style="font-size: 20px;" aria-hidden="true"></i>
    </button>
</div>

<script>
    // Immediately remove any duplicate theme toggles
    (function () {
        const toggles = document.querySelectorAll('#unique-theme-toggle');
        if (toggles.length > 1) {
            for (let i = 1; i < toggles.length; i++) {
                toggles[i].remove();
            }
        }
    })();

    // Initialize theme toggle
    function initializeThemeToggle() {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
        const savedTheme = localStorage.getItem('theme');
        const root = document.documentElement;
        const themeToggleButton = document.getElementById('theme-toggle-button');
        const themeIcon = document.getElementById('theme-toggle-icon');

        if (!themeToggleButton || !themeIcon) return;

        function setTheme(isDark) {
            root.setAttribute('data-theme', isDark ? 'dark' : 'light');
            themeIcon.className = isDark ? 'fas fa-moon' : 'fas fa-sun';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // Set initial theme
        if (savedTheme) {
            setTheme(savedTheme === 'dark');
        } else {
            setTheme(prefersDark.matches);
        }

        // Add click handler to toggle theme
        themeToggleButton.addEventListener('click', () => {
            const currentTheme = root.getAttribute('data-theme');
            setTheme(currentTheme !== 'dark');
        });

        // Listen for system theme changes
        prefersDark.addEventListener('change', (e) => {
            if (!localStorage.getItem('theme')) {
                setTheme(e.matches);
            }
        });
    }

    // Initialize on DOMContentLoaded
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeThemeToggle);
    } else {
        initializeThemeToggle();
    }
</script>
