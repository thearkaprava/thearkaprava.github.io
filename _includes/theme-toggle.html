<!-- Single theme toggle button -->
<div class="theme-toggle" style="position: fixed; top: 1em; right: 1em; z-index: 1000;">
    <button onclick="toggleTheme()" style="background: none; border: none; padding: 8px; cursor: pointer;">
        <i class="fas fa-sun" id="theme-toggle-icon" style="font-size: 20px; color: var(--text-color);"
            aria-hidden="true"></i>
    </button>
</div>

<script>
    // Remove any existing theme toggles first
    document.addEventListener('DOMContentLoaded', function () {
        const existingToggles = document.querySelectorAll('.theme-toggle');
        existingToggles.forEach((toggle, index) => {
            if (index > 0) toggle.remove();
        });
    });
</script>

<script>
    // Theme toggle functionality
    function setTheme(isDark) {
        const root = document.documentElement;
        const icon = document.getElementById('theme-toggle-icon');

        root.setAttribute('data-theme', isDark ? 'dark' : 'light');
        icon.className = isDark ? 'fas fa-moon' : 'fas fa-sun';
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        setTheme(currentTheme !== 'dark');
    }

    // Initialize theme
    function initTheme() {
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        setTheme(savedTheme ? savedTheme === 'dark' : prefersDark);
    }

    // Run initialization
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initTheme);
    } else {
        initTheme();
    }
</script>
