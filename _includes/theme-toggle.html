<!-- Add theme toggle button -->
<div class="theme-toggle" style="display: inline-block; cursor: pointer; margin-left: 1em; vertical-align: middle;">
    <i class="fas fa-sun" id="theme-toggle-icon" style="font-size: 20px;" aria-hidden="true"></i>
</div>

<script>
    // Ensure Font Awesome is loaded
    if (!document.querySelector('link[href*="font-awesome"]')) {
        const fontAwesome = document.createElement('link');
        fontAwesome.rel = 'stylesheet';
        fontAwesome.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css';
        document.head.appendChild(fontAwesome);
    }

    // Theme toggle logic
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
    const savedTheme = localStorage.getItem('theme');

    function setTheme(isDark) {
        const root = document.documentElement;
        const themeIcon = document.getElementById('theme-toggle-icon');

        if (isDark) {
            root.setAttribute('data-theme', 'dark');
            themeIcon.classList.remove('fa-sun');
            themeIcon.classList.add('fa-moon');
            document.querySelectorAll('a').forEach(link => {
                link.style.color = '{{ site.theme_settings.dark_mode_color }}';
            });
        } else {
            root.setAttribute('data-theme', 'light');
            themeIcon.classList.remove('fa-moon');
            themeIcon.classList.add('fa-sun');
            document.querySelectorAll('a').forEach(link => {
                link.style.color = '{{ site.theme_settings.light_mode_color }}';
            });
        }
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    // Set initial theme
    if (savedTheme) {
        setTheme(savedTheme === 'dark');
    } else {
        setTheme(prefersDark.matches);
    }

    // Add click handler to toggle theme
    document.querySelector('.theme-toggle').addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        setTheme(currentTheme !== 'dark');
    });

    // Listen for system theme changes
    prefersDark.addEventListener('change', (e) => {
        if (!localStorage.getItem('theme')) {
            setTheme(e.matches);
        }
    });
</script>
