{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <a class="site-title" href="{{ base_path }}/">{{ site.title }}</a>
        <ul class="visible-links">
          {% for link in site.data.navigation.main %}
          <li class="masthead__menu-item">
            <a href="{{ domain }}{{ link.url }}" {% if page.url contains link.url %}class="active" {% endif %}>
              {{ link.title }}
            </a>
          </li>
          {% endfor %}
        </ul>
        <button class="greedy-nav__toggle hidden" type="button">
          <span class="visually-hidden">Toggle menu</span>
          <div class="navicon"></div>
        </button>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>

<style>
  .masthead {
    border-bottom: 1px solid #f2f3f3;
  }

  .masthead__inner-wrap {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0.5em;
  }

  .greedy-nav {
    position: relative;
    display: flex;
    align-items: center;
    background: var(--masthead-bg);
    padding: 0.25em 0.5em;
    min-height: 2em;
    margin-left: 10em;
  }

  .site-title {
    margin-right: 1em;
  }

  .visible-links {
    display: flex;
    flex-grow: 0;
    list-style: none;
    padding: 0;
    margin: 0;
    gap: 2em;
  }

  .visible-links li {
    margin: 0;
  }

  .masthead__menu-item {
    padding: 0;
  }

  @media screen and (max-width: 600px) {
    .greedy-nav {
      padding: 0.25em;
    }

    .visible-links {
      gap: 0.5em;
    }
  }

  .visible-links a {
    font-weight: normal;
    /* Make all links normal weight by default */
  }

  .visible-links a.active {
    font-weight: bold;
    /* Bold only the active page link */
  }
</style>
